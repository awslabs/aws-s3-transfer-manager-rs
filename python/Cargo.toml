[package]
name = "aws-s3-transfer-python"
version = "0.1.0"
edition = "2021"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
license = "Apache-2.0"
rust-version = "1.94.1"
publish = false
description = "Python bindings for the Amazon S3 Transfer Manager"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
aws-sdk-s3-transfer-manager = { path = "../aws-sdk-s3-transfer-manager" }
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-runtime = "1.9.2"
aws-sdk-s3 = { version = "1.146.1", features = ["behavior-version-latest"] }
aws-smithy-types = "1.6.3"
bytes = "1"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "sync", "time", "fs", "io-util"] }
