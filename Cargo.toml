[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",
    "crates/aws-smithy-topology",
    "crates/aws-smithy-execution",
    "crates/aws-smithy-managed-http",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests",
    "wasm32-wasi-tests",
]
exclude = ["fuzz"]

[workspace.package]
rust-version = "1.94.1"
edition = "2024"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]

[workspace.dependencies]
aws-smithy-managed-http = { version = "0.1.0", path = "crates/aws-smithy-managed-http" }
aws-smithy-async = "1.3.0"
aws-smithy-execution = { version = "0.1.0", path = "crates/aws-smithy-execution" }
aws-config = { version = "1.12.0", default-features = false }
aws-runtime = "1.9.2"
# aws-sdk-s3's `default` features minus `rustls` and `default-https-client`; re-derive the list from
# upstream `default` when bumping the version. `rustls` enables the legacy hyper 0.14 / rustls 0.21
# client, which feature unification would otherwise build into every downstream crate.
# `default-https-client` does not build for wasm targets, so members that need it enable it, as
# they enable `aws-config`'s `default` features.
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-checksums = "0.65.0"
aws-smithy-dns = "0.2.0"
aws-smithy-http-client = { version = "1.5.2", default-features = false }
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime = "1.16.0"
aws-smithy-runtime-api = "1.19.0"
aws-smithy-types = "1.6.3"
aws-types = "1.6.0"
