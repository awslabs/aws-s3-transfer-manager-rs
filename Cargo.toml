[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",
    "crates/aws-smithy-topology",
    "crates/aws-smithy-execution",
    "crates/aws-smithy-managed-http",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
exclude = ["fuzz"]

[workspace.package]
rust-version = "1.94.1"
edition = "2024"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]

[workspace.dependencies]
aws-smithy-managed-http = { version = "0.1.0", path = "crates/aws-smithy-managed-http" }
aws-smithy-async = "1.3.0"
aws-smithy-execution = { version = "0.1.0", path = "crates/aws-smithy-execution" }
aws-config = "1.13.0"
aws-runtime = "1.10.2"
# aws-sdk-s3's `default` features minus `rustls`; re-derive the list from upstream `default`
# when bumping the version. `rustls` enables the legacy hyper 0.14 / rustls 0.21 client, which
# feature unification would otherwise build into every downstream crate.
aws-sdk-s3 = { version = "1.154.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-checksums = "0.65.0"
aws-smithy-dns = "0.2.3"
aws-smithy-http-client = { version = "1.5.2", default-features = false }
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime = "1.16.1"
aws-smithy-runtime-api = "1.19.1"
aws-smithy-types = "1.9.0"
aws-types = "1.7.0"
