[workspace]
resolver = "3"
members = [
    "crates/aws-s3-transfer",
    "crates/aws-smithy-topology",
    "crates/aws-smithy-execution",
    "crates/aws-smithy-managed-http",
    "crates/aws-s3-transfer-ext",

    # internal
    "crates/s3-mock-server",
    "benches",
    "integration-tests",
    "wasm32-wasi-tests",
]
exclude = ["fuzz", "tools/tmdev"]

[workspace.package]
rust-version = "1.96.0"
edition = "2024"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]

[workspace.dependencies]
aws-sdk-s3-transfer-manager = { version = "=0.4.0", path = "crates/aws-s3-transfer", default-features = false }
aws-credential-types = "1.3.0"
aws-smithy-managed-http = { version = "0.1.0", path = "crates/aws-smithy-managed-http" }
aws-smithy-async = "1.3.0"
aws-smithy-execution = { version = "0.1.0", path = "crates/aws-smithy-execution" }
aws-config = { version = "1.13.0", default-features = false }
aws-runtime = "1.10.2"
# aws-sdk-s3's `default` features minus `rustls`, `default-https-client`, `rt-tokio`, and `sigv4a`;
# re-derive the list from upstream `default` when bumping the version. `rustls` enables the legacy
# hyper 0.14 / rustls 0.21 client, which feature unification would otherwise build into every
# downstream crate. `default-https-client` does not build for wasm targets, and `rt-tokio` and
# `sigv4a` do not build for `wasm32-unknown-unknown`, so members enable them on the targets that
# support them, as they enable `aws-config`'s `default` features.
aws-sdk-s3 = { version = "1.158.0", default-features = false, features = ["http-1x"] }
aws-smithy-checksums = "0.65.0"
aws-smithy-dns = "0.2.3"
aws-smithy-http-client = { version = "1.5.2", default-features = false }
aws-smithy-mocks = "0.3.0"
aws-smithy-observability = "0.3.1"
aws-smithy-runtime = "1.16.1"
aws-smithy-runtime-api = "1.19.1"
aws-smithy-types = "1.9.0"
aws-types = "1.7.0"
