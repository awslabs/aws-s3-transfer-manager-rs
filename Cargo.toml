[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
exclude = ["fuzz"]

[workspace.dependencies]
aws-config = "1.12.0"
aws-runtime = "1.9.2"
# aws-sdk-s3's default features minus `rustls`, which enables the legacy hyper 0.14 /
# rustls 0.21 client in every consumer's graph through feature unification.
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-smithy-checksums = "0.65.0"
aws-smithy-dns = "0.2.0"
aws-smithy-http-client = "1.5.0"
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime = "1.16.0"
aws-smithy-runtime-api = "1.19.0"
aws-smithy-types = "1.6.3"
aws-types = "1.6.0"
