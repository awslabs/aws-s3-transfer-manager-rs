[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
exclude = ["fuzz"]

[workspace.dependencies]
aws-config = "1.13.0"
aws-runtime = "1.10.2"
aws-sdk-s3 = "1.154.0"
aws-smithy-checksums = "0.65.0"
aws-smithy-dns = "0.2.3"
aws-smithy-http-client = "1.5.1"
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime = "1.16.1"
aws-smithy-runtime-api = "1.19.1"
aws-smithy-types = "1.9.0"
aws-types = "1.7.0"
