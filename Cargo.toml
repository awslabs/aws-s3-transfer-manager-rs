[workspace]
resolver = "2"
# LOCAL DEV ONLY (vnext-conn-pool): workspace trimmed to just the TM crate so
# Cargo resolves only against the local SDK build. The other members
# (s3-mock-server/benches/integration-tests) drag in s3s, which pins
# hmac=0.13.0-rc.5 and conflicts with the local SDK's aws-sigv4 -> hmac 0.13.0.
# Restore the full list (and path-dep aws-sdk-s3 in integration-tests) before PR.
members = [
    "aws-sdk-s3-transfer-manager",

    # internal — temporarily excluded (see note above)
    # "s3-mock-server",
    # "benches",
    # "integration-tests"
]

# LOCAL DEV ONLY — DO NOT COMMIT TO THE vnext-conn-pool PR.
# Points the shared AWS runtime libraries at the locally-built smithy-rs SDK
# artifacts that contain the partitioned HTTP connection pool
# (aws-smithy-http-client 1.3.0). Generated service crates (aws-sdk-s3, sts,
# sso, ssooidc) are 0.0.0-local and cannot be bridged by [patch]; aws-sdk-s3 is
# wired as a path dependency in aws-sdk-s3-transfer-manager/Cargo.toml instead
# (it transitively pulls the local sts/sso/ssooidc via its own path deps).
# Source: /Users/todaaron/sandbox/rs/smithy-rs (branch aajtodd/http-conn-pool-v2-explore)
[patch.crates-io]
aws-config = { path = "/Users/todaaron/sandbox/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-config" }
