[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
exclude = ["fuzz"]

[workspace.dependencies]
# TEMP(conn-pool): the aws-* crates resolve to the assembled smithy-rs SDK
# (`./gradlew :aws:sdk:assemble` in smithy-rs) until the connection pool is released.
# Restore the crates.io requirements below when reverting.
aws-config = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-config" }
aws-runtime = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-runtime" }
aws-sdk-s3 = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/s3" }
aws-smithy-checksums = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-checksums" }
aws-smithy-dns = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-dns" }
aws-smithy-http-client = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-http-client" }
aws-smithy-mocks = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-mocks" }
aws-smithy-runtime = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-runtime" }
aws-smithy-runtime-api = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-runtime-api" }
aws-smithy-types = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-smithy-types" }
aws-types = { path = "/local/home/todaaron/rs/smithy-rs/aws/sdk/build/aws-sdk/sdk/aws-types" }
