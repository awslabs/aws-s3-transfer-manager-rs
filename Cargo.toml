[workspace]
resolver = "2"
members = [
    "aws-sdk-s3-transfer-manager",

    # Reusable runtime components
    "crates/aws-ort-topology",
    "crates/aws-ort-execution",
    "crates/aws-ort-http",

    # internal
    "s3-mock-server",
    "benches",
    "integration-tests"
]
exclude = ["fuzz"]

[workspace.package]
rust-version = "1.94.1"
edition = "2024"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]

[workspace.dependencies]
aws-ort-execution = { version = "0.1.0", path = "crates/aws-ort-execution" }
aws-config = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-config" }
aws-runtime = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-runtime" }
aws-sdk-s3 = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/s3" }
aws-smithy-async = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-async" }
aws-smithy-checksums = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-checksums" }
aws-smithy-dns = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-dns" }
aws-smithy-http-client = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-http-client", default-features = false }
aws-smithy-mocks = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-mocks" }
aws-smithy-runtime = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-runtime" }
aws-smithy-runtime-api = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-runtime-api" }
aws-smithy-types = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-smithy-types" }
aws-types = { path = "../smithy-rs.ort/aws/sdk/build/aws-sdk/sdk/aws-types" }
