[package]
name = "benches"
version = "0.0.0"
edition = "2021"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
license = "Apache-2.0"
publish = false
description = "Internal benchmarks for aws-s3-transfer"

[[bench]]
name = "throughput"
path = "throughput.rs"
harness = false

[[bench]]
name = "buffer_pool"
path = "buffer_pool_main.rs"
harness = false

[[bench]]
name = "upload_part_stream"
path = "upload_part_stream.rs"
harness = false

[dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }
s3-mock-server = { path = "../crates/s3-mock-server" }
aws-s3-transfer = { path = "../crates/aws-s3-transfer" }
bytes = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(s3_tm_bench)'] }
