[package]
name = "in-memory-s3"
version = "0.1.0"
edition = "2021"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>"]
license = "Apache-2.0"
publish = false
description = "An in-memory S3 connector for transfer-manager tests that run without a network"

[dependencies]
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
aws-smithy-types = { workspace = true }
bytes = "1"
tokio = { version = "1.43.0", features = ["rt"] }
