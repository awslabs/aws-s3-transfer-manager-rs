[package]
name = "tm-api-review"
version = "0.0.0"
edition = "2024"
rust-version = "1.94.1"
publish = false
description = "Customer-scenario code for the transfer manager API review"

# A standalone workspace, so this crate resolves its dependencies and features the way a downstream
# consumer would, rather than through the transfer manager workspace's unified graph.
[workspace]
resolver = "3"

[features]
# Scenarios that need the transfer manager's AWS SDK for Rust S3 interoperability.
sdk-v1 = ["aws-sdk-s3-transfer-manager/sdk-v1"]
# Scenarios that adopt a caller-built managed runtime through the extension crate.
ext = ["dep:aws-sdk-s3-transfer-manager-ext", "dep:aws-smithy-execution", "dep:aws-smithy-managed-http"]
# Scenarios that record runtime traces with dial9.
dial9 = ["aws-sdk-s3-transfer-manager/dial9", "dep:dial9"]

[dependencies]
aws-sdk-s3-transfer-manager = { path = "../aws-sdk-s3-transfer-manager" }
aws-sdk-s3 = "1.154.0"
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-aws-lc"] }
aws-sdk-s3-transfer-manager-ext = { path = "../crates/aws-sdk-s3-transfer-manager-ext", optional = true }
aws-smithy-execution = { path = "../crates/aws-smithy-execution", optional = true }
aws-smithy-managed-http = { path = "../crates/aws-smithy-managed-http", features = ["client"], optional = true }
dial9 = { version = "0.5", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"

[dev-dependencies]
# Captures outgoing requests so scenarios can show what reaches the wire.
aws-smithy-http-client = { version = "1.5.2", features = ["test-util"] }
# Local S3 endpoint so transfer scenarios run end to end.
s3-mock-server = { path = "../s3-mock-server" }
