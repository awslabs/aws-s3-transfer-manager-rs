[package]
name = "aws-sdk-s3-transfer-manager-ext"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "Apache-2.0"
repository = "https://github.com/awslabs/aws-s3-transfer-manager-rs"
description = "Optional integrations for S3 Transfer Manager."
readme = "README.md"
categories = ["asynchronous", "concurrency"]
keywords = ["aws", "smithy", "s3", "runtime"]

[dependencies]
aws-smithy-execution.workspace = true
aws-sdk-s3-transfer-manager = { workspace = true, default-features = false, features = ["__unstable_ext"] }

[dev-dependencies]
aws-smithy-managed-http = { workspace = true, features = ["client"] }
aws-credential-types.workspace = true
aws-smithy-checksums.workspace = true
aws-smithy-http-client = { workspace = true, features = ["wire-mock"] }
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
aws-types.workspace = true
crossbeam-skiplist = "0.1.3"
tempfile = "3.12"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

[features]
dial9 = ["aws-sdk-s3-transfer-manager/dial9", "aws-smithy-execution/dial9"]
