on:
  pull_request:

name: Python

# Allow one instance of this workflow per pull request, and cancel older runs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  rust_stable: stable

defaults:
  run:
    shell: bash
    working-directory: python

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$rust_stable" --profile minimal --component clippy,rustfmt
          rustup default "$rust_stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: python -> ../target
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
      - run: cargo fmt --check
      - run: uv sync --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ github.workspace }}/python/.venv/bin/python
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync mypy

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-24.04-arm
            python: "3.15"
          - os: macos-15
            python: "3.11"
          - os: macos-15
            python: "3.15"
          - os: windows-2022
            python: "3.11"
          - os: windows-2022
            python: "3.15"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$rust_stable" --profile minimal
          rustup default "$rust_stable"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            python -> ../target
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest
