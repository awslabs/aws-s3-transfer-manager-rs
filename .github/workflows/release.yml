name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Source ref; publication requires the date tag recorded in release.toml'
        required: true
        type: string
        default: main
      dry_run:
        description: 'Verify packages without uploading them'
        required: true
        type: boolean
        default: true

concurrency:
  group: crates-io-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  rust_min: '1.94.1'
  AWS_REGION: us-west-2

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - name: Validate the source and release record
        id: plan
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(check --ref "$RELEASE_REF")
          if [[ "$RELEASE_DRY_RUN" == false ]]; then
            args+=(--require-tag)
          fi
          just release "${args[@]}"
          echo "has_pending=$(jq '.pending | length > 0' target/release/plan.json)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        if: inputs.dry_run == false && steps.plan.outputs.has_pending == 'true'
        with:
          role-to-assume: ${{ secrets.RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Get the Cargo registry token
        if: inputs.dry_run == false && steps.plan.outputs.has_pending == 'true'
        id: cargo-registry-token
        env:
          TOKEN_KEY_NAME: ${{ secrets.TOKEN_KEY_NAME }}
        run: |
          token=$(aws secretsmanager get-secret-value --secret-id "$TOKEN_KEY_NAME" \
            --region "$AWS_REGION" --query SecretString --output text)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Verify or publish the recorded packages
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-registry-token.outputs.token }}
        run: |
          args=(publish --ref "$RELEASE_REF")
          if [[ "$RELEASE_DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          just release "${args[@]}"
      - name: Save the release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release/plan.json
          if-no-files-found: warn
          retention-days: 90
