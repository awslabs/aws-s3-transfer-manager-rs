name: Diag Windows large download

# TEMPORARY diagnostic workflow for the Windows-only large-download stall.
# Windows-only; runs just the large-object e2e test with sink flush-timing
# logging, in preallocate-on and preallocate-off variants. Delete once the
# stall is understood.

on:
  push:
    branches:
      - vnext-integrity-debug
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  rust_stable: stable
  CI_ROLE_ARN: ${{ secrets.CI_ROLE_ARN }}
  AWS_REGION: us-west-2

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    name: Diag large download (windows)
    runs-on: windows-2022
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
      - uses: Swatinem/rust-cache@v2

      # Confirms the Windows preallocate fix: this is the real production path
      # (no env override). With preallocate now a no-op on Windows there is no
      # NTFS valid-data-length gap to zero-fill, so the flush-timing log should
      # show no multi-second ahead_by writes and the 6 GiB download should pass.
      # --nocapture because the subscriber writes to stderr from managed threads
      # (libtest capture is thread-local and managed threads bypass it).
      - name: large download + flush timing (real fix)
        env:
          RUSTFLAGS: "--cfg e2e_test"
          RUST_LOG: "download::sink=debug"
        run: |
          cargo test -p integration-tests \
            large_object_file_download_validates_real_gp -- --nocapture
