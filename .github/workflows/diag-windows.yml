name: Diag Windows large download

# TEMPORARY diagnostic workflow for the Windows-only large-download stall.
# Windows-only; runs just the large-object e2e test with sink flush-timing
# logging, in preallocate-on and preallocate-off variants. Delete once the
# stall is understood.

on:
  push:
    branches:
      - vnext-integrity-debug
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  rust_stable: stable
  CI_ROLE_ARN: ${{ secrets.CI_ROLE_ARN }}
  AWS_REGION: us-west-2

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    name: Diag large download (windows)
    runs-on: windows-2022
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.rust_stable }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_stable }}
      - uses: Swatinem/rust-cache@v2

      # Variant 1: sparse file + unchanged out-of-order writes. FSCTL_SET_SPARSE
      # makes the gap a hole instead of a synchronous zero-fill. Expect pass with
      # the existing out-of-order write pattern preserved.
      - name: sparse file (out-of-order writes)
        continue-on-error: true
        env:
          RUSTFLAGS: "--cfg e2e_test"
          RUST_LOG: "download::sink=debug"
          S3TM_DIAG_WRITE_MODE: "sparse"
        run: |
          cargo test -p integration-tests \
            large_object_file_download_validates_real_gp -- --nocapture

      # Variant 2: contiguous-only flush. Writes only land at EOF (no zero-fill),
      # but coalesces unbounded runs (big infrequent blocking writes, backlog).
      - name: contiguous flush
        continue-on-error: true
        env:
          RUSTFLAGS: "--cfg e2e_test"
          RUST_LOG: "download::sink=debug"
          S3TM_DIAG_WRITE_MODE: "contiguous"
        run: |
          cargo test -p integration-tests \
            large_object_file_download_validates_real_gp -- --nocapture

      # Variant 3: contiguous flush + 64 MiB run cap. Bounds each write so it
      # can't block the reactor for long.
      - name: contiguous flush + run cap
        continue-on-error: true
        env:
          RUSTFLAGS: "--cfg e2e_test"
          RUST_LOG: "download::sink=debug"
          S3TM_DIAG_WRITE_MODE: "contiguous_cap"
          S3TM_DIAG_RUN_CAP_MIB: "64"
        run: |
          cargo test -p integration-tests \
            large_object_file_download_validates_real_gp -- --nocapture
