name: aws-sdk-s3 latest

# The lockfile pins aws-sdk-s3, so a release that changes the response checksum
# outcome the download verdict reads would surface only when the lockfile moves.
on:
  schedule:
    - cron: '0 3 * * *' # run at 3 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksum-verdict:
    name: checksum verdict on the latest aws-sdk-s3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Update aws-sdk-s3 and its dependencies to their latest compatible releases
        run: cargo update -p aws-sdk-s3 --recursive
      # A filter that matches no test exits 0, so require a pass.
      - name: checksum verdict tests
        run: |
          out=$(cargo test -p aws-sdk-s3-transfer-manager --all-features --test download_test \
            -- test_integrity_checks 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if ! grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$out"; then
            echo "no checksum verdict test ran" >&2
            exit 1
          fi
