[package]
name = "aws-sdk-s3-transfer-manager"
version = "0.1.3"
edition = "2021"
authors = ["AWS Rust SDK Team <aws-sdk-rust@amazon.com>", "Aaron Todd <todaaron@amazon.com>"]
license = "Apache-2.0"
readme = "README.md"
rust-version = "1.86.0"
repository = "https://github.com/awslabs/aws-s3-transfer-manager-rs"
description = """
A high performance Amazon S3 transfer manager for Rust.
"""
categories = ["asynchronous", "concurrency"]
keywords = ["AWS", "Amazon", "S3", "high-performance", "transfer-manager"]

[dependencies]
async-channel = "2.3.1"
aws-config = { version = "1.8.2", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.122.0", features = ["behavior-version-latest"] }
aws-smithy-runtime-api = "1.8.3"
aws-runtime = "1.5.9"
aws-smithy-types = "1.3.2"
aws-types = "1.3.7"
blocking = "1.6.1"
bytes = "1"
bytes-utils = "0.1.4"
futures-util = "0.3.31"
path-clean = "1.0.1"
pin-project-lite = "0.2.16"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "io-util", "sync", "fs", "macros"] }
tracing = "0.1"
walkdir = "2"
tokio-util = "0.7.13"
crossbeam-skiplist = "0.1.3"
crossbeam-utils = "0.8"
parking_lot = "0.12"
aws-smithy-http-client = { version = "1.0.6", features = ["rustls-aws-lc"] }
aws-smithy-dns = { version = "0.1.9", features = ["hickory-dns"] }
fastrand = "2.1.1"

[dev-dependencies]
aws-sdk-s3 = { version = "1.122.0", features = ["behavior-version-latest", "test-util"] }
aws-smithy-checksums = "0.63.4"
aws-smithy-mocks = "0.2"
aws-smithy-runtime = { version = "1.8.4", features = ["client", "test-util"] }
aws-smithy-http-client = { version = "1.0.6", features = ["test-util", "wire-mock", "rustls-aws-lc"] }
clap = { version = "4.5.7", default-features = false, features = ["derive", "std", "help"] }
console-subscriber = "0.4.0"
http = "1"
http-body-1x = { package = "http-body", version = "1" }
fastrand = "2.1.1"
futures-test = "0.3.30"
md5 = "0.7.0"
tempfile = "3.12.0"
test-common = { path = "./test-common" }
tokio-test = "0.4.4"
tower-test = "0.4.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
jemallocator = "0.5.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(e2e_test)'] }
